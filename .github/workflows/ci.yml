name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore CashFlow.sln

      # Warnings are errors (see Directory.Build.props), so this step is also the lint gate.
      - name: Build
        run: dotnet build CashFlow.sln --configuration Release --no-restore

      # The whole suite runs without Docker: SQLite in memory and the in-process transport.
      - name: Test
        run: >
          dotnet test CashFlow.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 7

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Launches API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Launches/CashFlow.Launches.Api/Dockerfile
          push: false
          tags: cashflow-launches-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Consolidation API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Consolidation/CashFlow.Consolidation.Api/Dockerfile
          push: false
          tags: cashflow-consolidation-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
